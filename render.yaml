services:
  - type: web
    name: taskbookingapp-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate -w @task-platform/api && npm run build -w @task-platform/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: email
      - key: ADMIN_API_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false

  - type: web
    name: taskbookingapp-admin
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w @task-platform/admin
    startCommand: npm run start -w @task-platform/admin
    envVars:
      - key: API_BASE_URL
        value: https://taskbookingapp-api.onrender.com/api
      - key: API_ADMIN_KEY
        sync: false
